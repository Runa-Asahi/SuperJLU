name: Release Windows exe

# 推送 v* 标签：构建托盘版 SuperJLU.exe（packaging/superjlu.spec），附带 SHA256，发布到 GitHub Release。
# 也可手动运行（只上传构建产物，不发 Release）。与 release-android.yml 共用同一个 Release（softprops 会复用已存在的 Release）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop,captcha]" pyinstaller pytest
      - name: Test
        run: pytest -q
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import jlu_toolkit; print(jlu_toolkit.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Build SuperJLU.exe
        run: python packaging/build_windows.py
      - name: SHA256
        shell: pwsh
        run: |
          if (!(Test-Path dist\SuperJLU.exe)) { throw "SuperJLU.exe 未生成" }
          $h = (Get-FileHash dist\SuperJLU.exe -Algorithm SHA256).Hash.ToLower()
          "$h  SuperJLU.exe" | Out-File -Encoding ascii dist\SuperJLU.exe.sha256
          Get-Content dist\SuperJLU.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SuperJLU-windows
          path: |
            dist/SuperJLU.exe
            dist/SuperJLU.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          name: SuperJLU-windows
          path: dist
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SuperJLU ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/SuperJLU.exe
          fail_on_unmatched_files: true
