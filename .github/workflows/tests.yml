name: Tests

on:
  pull_request:
    paths-ignore:
      - 'wechat/**'
  push:
    paths-ignore:
      - 'wechat/**'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install ".[captcha]" pytest
      - name: pytest (includes node UI tree tests)
        run: pytest -q
      - name: Grade calculation, filtering and sorting (Node)
        run: node tests/js_grade_test.js
      - name: Grade import, offline states and file drops (Node)
        run: node tests/js_grade_import_test.js
      - name: VPN and JWXT login completion (Node)
        run: node tests/js_network_test.js
      - name: Timetable personal edits UI (Node)
        run: node tests/js_schedule_edit_test.js
      - name: Boot periods TDZ (Node)
        run: node tests/js_boot_periods_tdz_test.js
      - name: update card (node)
        run: node tests/js_update_card_test.js
      - name: UI script syntax (node --check)
        shell: bash
        run: |
          python -c "import re;from jlu_toolkit.ui_page import PAGE;[open(f'page{i}.js','w',encoding='utf-8').write(b) for i,b in enumerate(re.findall(r'<script>(.*?)</script>',PAGE,re.S))]"
          for f in page*.js; do node --check "$f"; done
