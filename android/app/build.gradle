plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "cn.superjlu.app"
    compileSdk 35
    defaultConfig {
        applicationId "cn.superjlu.app"
        minSdk 24
        targetSdk 35
        versionCode((System.getenv("JLU_VERSION_CODE") ?: "10000") as int)
        versionName(System.getenv("JLU_VERSION_NAME") ?: "1.2.6")
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs += [
                "--add-opens=java.base/java.lang=ALL-UNNAMED",
                "--add-opens=java.base/java.util=ALL-UNNAMED",
                "--add-opens=java.base/java.io=ALL-UNNAMED",
                "--add-opens=java.base/java.net=ALL-UNNAMED",
                "--add-opens=java.base/java.security=ALL-UNNAMED",
                "--add-opens=java.base/java.text=ALL-UNNAMED",
                "--add-opens=java.base/jdk.internal.access=ALL-UNNAMED",
                "--add-opens=java.desktop/java.awt.font=ALL-UNNAMED",
                "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED"
            ]
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.17"
}

chaquopy {
    defaultConfig {
        version "3.13"
        // 构建机上需要同版本的 Python（python3.13）；可用 -PbuildPython=/path/python3.13 覆盖
        if (project.hasProperty("buildPython")) buildPython(project.property("buildPython"))
        pip {
            install "cryptography==42.0.8"
            // 图形验证码自动识别（captcha_solver）需要 Pillow；Chaquopy 提供 cp313 arm64/x86_64 轮子
            install "pillow==11.0.0"
            // 成绩文件导入：纯 Python 读取器，不引入 pandas / NumPy 原生依赖。
            install "openpyxl>=3.1,<4"
            install "xlrd>=2.0,<3"
            // keyring 在 Android 上没有可用后端，暂不安装，走 secure_store 的文件回退
        }
    }
    sourceSets {
        main {
            // 直接打包仓库根目录下的 jlu_toolkit 包（不复制，桌面端代码保持唯一来源）
            srcDir "../.."
            include "jlu_toolkit/**", "jlu_android.py"
            exclude "**/__pycache__/**"
            srcDir "src/main/python"
        }
    }
}
